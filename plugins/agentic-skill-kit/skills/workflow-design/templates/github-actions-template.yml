# Generic build -> test -> deploy (staging -> production) workflow.
# Copy to .github/workflows/ci-cd.yml and replace the commands marked TODO.
# Defaults shown for .NET; swap the setup step for Node/Java/Python (see comments).
# Hardening: pin third-party actions to a full commit SHA; keep major tags only for actions/*.
# Production approvals: set required reviewers on the "production" environment
# (Settings > Environments), which pauses the deploy-production job until approved.
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      redeploy_version:
        description: "Existing build version (run number) to redeploy, for rollback. Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_NAME: my-service            # TODO
  ARTIFACT_NAME: app-package
  DOTNET_VERSION: "8.0.x"         # TODO: match global.json

jobs:
  build-test:
    name: Build and test
    if: ${{ github.event.inputs.redeploy_version == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Node:   actions/setup-node@v4 with node-version + cache: npm
      # Java:   actions/setup-java@v4 with distribution: temurin, java-version: '21', cache: maven
      # Python: actions/setup-python@v5 with python-version: '3.12', cache: pip

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Dependency vulnerability check
        run: dotnet list package --vulnerable --include-transitive

      - name: Package
        if: github.event_name == 'push'
        run: dotnet publish --no-build --configuration Release --output publish

      - name: Upload package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.run_number }}
          path: publish
          retention-days: 30

  deploy-staging:
    name: Deploy to staging
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.example.com     # TODO
    permissions:
      contents: read
      id-token: write                      # OIDC login to the cloud, no stored secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.run_number }}
          path: publish
      # TODO: cloud login via OIDC, e.g. azure/login or aws-actions/configure-aws-credentials
      - name: Deploy
        run: echo "TODO deploy ./publish to staging (e.g. slot, helm upgrade, container app revision)"
      - name: Database migrations (backward compatible only)
        run: echo "TODO run migrations"
      - name: Smoke / Playwright tests against staging
        run: echo "TODO e.g. npx playwright test --project=smoke"

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production                     # approval gate lives on this environment
      url: https://app.example.com         # TODO
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.run_number }}
          path: publish
      - name: Deploy (blue-green / canary)
        run: echo "TODO deploy to inactive slot, then shift traffic"
      - name: Smoke test and health check
        run: echo "TODO curl health endpoint; check error rate SLO"
      - name: Automatic rollback on failure
        if: failure()
        run: echo "TODO swap slot back / helm rollback / previous revision"

  rollback:
    name: Redeploy previous version (manual rollback)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.redeploy_version != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Artifacts from other runs need the run id; look it up or store versions in a registry.
          name: ${{ env.ARTIFACT_NAME }}-${{ github.event.inputs.redeploy_version }}
          path: publish
          run-id: ${{ vars.RUN_ID_FOR_ROLLBACK }}   # TODO: or deploy from your container/package registry by tag
          github-token: ${{ github.token }}
      - name: Deploy previous version
        run: echo "TODO deploy ./publish to production"
